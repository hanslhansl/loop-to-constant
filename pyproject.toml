[project]
name = "loop-to-constant"
version = "0.1.0"
description = "A Python library that transforms loops into closed-form constant-time expressions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.13"]
license = { text = "MIT" }

[dependency-groups]
dev = [
  "numpy",
  "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_to_constant"]
